<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ucanduit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/iconoir.css">
    <link rel="stylesheet" href="src/styles.css">
    <link rel="stylesheet" href="src/tools/timer.css">
    <link rel="stylesheet" href="src/tools/lofi.css">
</head>
<body>
    <div class="animated-background" id="animated-bg">
        <!-- Background circles will be generated by JavaScript -->
    </div>

    <div class="container">
        <!-- Circular Oscilloscope Assistant -->
        <div class="oscilloscope-container" id="oscilloscope-container">
            <!-- Timer Ring - appears when timer is active, dimensions set by timer.js -->
            <svg class="timer-ring" id="timer-ring">
                <circle id="timer-ring-background" fill="transparent"/>
                <circle id="timer-ring-progress" class="timer-ring-progress" fill="transparent"/>
            </svg>
            <canvas id="oscilloscope-canvas" width="300" height="300"></canvas>
        </div>
        
        <!-- Control Panel -->
        <div class="control-panel" id="control-panel">
            <div class="header-container">
                <h1 class="header-title">ucanduit</h1>
                <div class="settings-menu">
                    <div class="settings-button" id="settings-button"><i class="iconoir-wrench"></i></div>
                    <div class="settings-dropdown" id="settings-dropdown">
                        <div class="settings-item" data-action="resizeHorizontal">
                            <span>Horizontal Mode</span>
                        </div>
                        <div class="settings-item" data-action="resizeVertical">
                            <span>Vertical Mode</span>
                        </div>
                        <div class="settings-item" data-action="toggleDarkMode">
                            <span id="dark-mode-setting-text">Dark Mode</span>
                        </div>
                        <div class="settings-item" data-action="toggleDemo">
                            <span id="demo-setting-text">Toggle Demo</span>
                        </div>
                        <div class="settings-item" data-action="openSettingsWindow">
                            <span>Open Settings</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="status-ticker-container">
                <button class="ticker-nav-btn" id="ticker-prev">‹</button>

                <div class="badge badge-success status-badge" id="status-badge">Assistant Ready</div>

                <button class="ticker-nav-btn" id="ticker-next">›</button>
            </div>
            
            <div class="tools-container">
                <!-- Timer Section -->
                <div class="collapsible-section">
                    <div class="section-header" data-section="timer">
                        <div class="section-title"><i class="iconoir-timer"></i> Timer</div>
                        <div class="section-toggle collapsed" id="timer-toggle">+</div>
                    </div>
                    <div class="section-content collapsed" id="timer-content">
                        <!-- Timer tool content will be dynamically loaded here -->
                    </div>
                </div>
               
                
                <!-- Focus Noise Generator Section -->
                <div class="collapsible-section">
                    <div class="section-header" data-section="sounds">
                        <div class="section-title"><i class="iconoir-sound-high"></i> Focus Noise Generator</div>
                        <div class="section-toggle collapsed" id="sounds-toggle">+</div>
                    </div>
                    <div class="section-content collapsed" id="sounds-content">
                        <!-- Focus noise generator tool content will be dynamically loaded here -->
                    </div>
                </div>
                
                <!-- Ambient Sounds Section -->
                <div class="collapsible-section">
                    <div class="section-header" data-section="ambient">
                        <div class="section-title"><i class="iconoir-music-note"></i> Ambient Sounds</div>
                        <div class="section-toggle collapsed" id="ambient-toggle">+</div>
                    </div>
                    <div class="section-content collapsed" id="ambient-content">
                        <!-- Ambient sounds tool content will be dynamically loaded here -->
                    </div>
                </div>
                
                <!-- Todo List Section -->
                <div class="collapsible-section">
                    <div class="section-header" data-section="todos">
                        <div class="section-title"><i class="iconoir-list"></i> Todo Lists</div>
                        <div class="section-toggle collapsed" id="todos-toggle">+</div>
                    </div>
                    <div class="section-content collapsed" id="todos-content">
                        <!-- Todo list tool content will be dynamically loaded here -->
                    </div>
                </div>
                
                <!-- Memos Section -->
                <div class="collapsible-section">
                    <div class="section-header" data-section="memos">
                        <div class="section-title"><i class="iconoir-notes"></i> Quick Memos</div>
                        <div class="section-toggle collapsed" id="memos-toggle">+</div>
                    </div>
                    <div class="section-content collapsed" id="memos-content">
                        <!-- Memos tool content will be dynamically loaded here -->
                    </div>
                </div>
                
                <!-- Weather Section -->
                <div class="collapsible-section">
                    <div class="section-header" data-section="weather">
                        <div class="section-title"><i class="iconoir-sun-light"></i> Weather</div>
                        <div class="section-toggle collapsed" id="weather-toggle">+</div>
                    </div>
                    <div class="section-content collapsed" id="weather-content">
                        <!-- Weather tool content will be dynamically loaded here -->
                    </div>
                </div>
                
                <!-- Lo-Fi Music Section -->
                <div class="collapsible-section">
                    <div class="section-header" data-section="lofi">
                        <div class="section-title"><i class="iconoir-headset"></i> Lo-Fi Music</div>
                        <div class="section-toggle collapsed" id="lofi-toggle">+</div>
                    </div>
                    <div class="section-content collapsed" id="lofi-content">
                        <!-- Lo-Fi tool content will be dynamically loaded here -->
                    </div>
                </div>
                
                <!-- Future tools sections will go here -->
                
            </div>
        </div>
    </div>

    <!-- Import window management module -->
    <script type="module" src="src/window-management.js"></script>
    
    <script type="module">
        
        // Window initialization will be handled by the imported module
        
        window.toggleDemo = function() {
            if (window.oscilloscopeTool) {
                window.oscilloscopeTool.demoMode = !window.oscilloscopeTool.demoMode;
                const statusText = window.oscilloscopeTool.demoMode ? 'Demo ON' : 'Demo OFF';
                document.getElementById('status-badge').textContent = `OssC Active - ${statusText}`;
                document.getElementById('status-badge').className = window.oscilloscopeTool.demoMode ? 'badge badge-primary' : 'badge badge-success';
                document.getElementById('demo-setting-text').textContent = window.oscilloscopeTool.demoMode ? 'Disable Demo' : 'Enable Demo';

                // Track demo mode toggle for analytics
                if (window.usageAnalytics) {
                    window.usageAnalytics.data.osscMetrics.demoModeToggled++;
                }
            }
        };
        
        // Dark mode toggle
        window.toggleDarkMode = async function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            // Update settings if available
            try {
                const { settings } = await import('./src/tools/settings.js');
                await settings.set('ui.theme', newTheme);
            } catch (error) {
                console.log('Could not update settings:', error);
                // Fallback to direct theme change
                applyTheme(newTheme);
            }
        };
        
        // Settings menu functions
        window.toggleSettings = function() {
            const dropdown = document.getElementById('settings-dropdown');
            dropdown.classList.toggle('show');
        };
        
        // Open settings window function
        window.openSettingsWindow = async function() {
            try {
                if (!window.__TAURI__) {
                    // Browser fallback - open in new tab
                    window.open('src/settings.html', '_blank', 'width=500,height=700');
                    if (window.statusTicker) {
                        window.statusTicker.setManual('Settings opened (browser mode)', 'primary', 2000);
                    }
                    return;
                }

                // Use the same pattern as memo and weather windows
                if (window.__TAURI__.webview && window.__TAURI__.webviewWindow) {
                    const { webviewWindow } = window.__TAURI__;
                    
                    const windowLabel = `settings-window-${Date.now()}`;
                    const windowTitle = 'Settings - ucanduit';
                        
                    const settingsWindow = new webviewWindow.WebviewWindow(windowLabel, {
                        url: 'src/settings.html',
                        title: windowTitle,
                        width: 500,
                        height: 700,
                        alwaysOnTop: false,
                        decorations: true,
                        transparent: false,
                        titleBarStyle: 'overlay',
                        resizable: true,
                        minimizable: true,
                        maximizable: false,
                        center: true
                    });

                    // Handle window events
                    settingsWindow.once('tauri://created', () => {
                        console.log('Settings window created successfully');
                        if (window.statusTicker) {
                            window.statusTicker.setManual('Settings window opened', 'success', 2000);
                        }
                    });

                    settingsWindow.once('tauri://error', (error) => {
                        console.error('Settings window creation error:', error);
                        if (window.statusTicker) {
                            window.statusTicker.setManual('Failed to open settings window', 'danger', 3000);
                        }
                    });
                    
                } else {
                    throw new Error('webviewWindow API not available');
                }
                
                // Close the dropdown after opening settings
                const dropdown = document.getElementById('settings-dropdown');
                dropdown.classList.remove('show');
                
            } catch (error) {
                console.error('Failed to open settings window:', error);
                // Show user-friendly error
                if (window.statusTicker) {
                    window.statusTicker.setManual('Failed to open settings', 'danger', 3000);
                }
                
                // Fallback: open in browser tab
                window.open('src/settings.html', '_blank', 'width=500,height=700');
            }
        };
        
        // Tool management system
        window.loadedTools = {};
        window.persistentAudio = {}; // Store audio state for collapsed tools
        
        // Collapsible section functions - tools are already loaded with proper containers
        window.toggleSection = async function(sectionName) {
            const content = document.getElementById(sectionName + '-content');
            const toggle = document.getElementById(sectionName + '-toggle');
            
            // Simply toggle visibility - tools are already loaded with correct containers
            content.classList.toggle('collapsed');
            toggle.classList.toggle('collapsed');
            
            // Tools remain fully loaded and functional when collapsed
        };
        
        // Dynamic ES6 module loading
        async function loadTool(toolName, container) {
            if (window.loadedTools[toolName]) {
                console.log(`Tool ${toolName} already loaded`);
                // For audio tools that stay loaded, just update container reference
                if (isAudioTool(toolName)) {
                    window.loadedTools[toolName].container = container;
                    console.log(`Updated container reference for persistent audio tool: ${toolName}`);
                }
                return;
            }
            
            try {
                let toolModule;
                let ToolClass;
                
                if (toolName === 'timer') {
                    toolModule = await import('./src/tools/timer.js');
                    ToolClass = toolModule.TimerTool;
                } else if (toolName === 'sounds') {
                    toolModule = await import('./src/tools/ambient-sounds.js');
                    ToolClass = toolModule.FocusNoiseGeneratorTool;
                } else if (toolName === 'ambient') {
                    toolModule = await import('./src/tools/ambient-sounds-loops.js');
                    ToolClass = toolModule.AmbientSoundsTool;
                } else if (toolName === 'todos') {
                    toolModule = await import('./src/tools/todo-list.js');
                    ToolClass = toolModule.TodoListTool;
                } else if (toolName === 'memos') {
                    toolModule = await import('./src/tools/memos.js');
                    ToolClass = toolModule.MemosTool;
                } else if (toolName === 'weather') {
                    toolModule = await import('./src/tools/weather.js');
                    ToolClass = toolModule.WeatherTool;
                } else if (toolName === 'lofi') {
                    toolModule = await import('./src/tools/lofi.js');
                    ToolClass = toolModule.LofiTool;
                } else {
                    throw new Error(`Unknown tool: ${toolName}`);
                }
                
                // Create tool instance
                const toolInstance = new ToolClass(container);
                
                // Store reference for cleanup
                window.loadedTools[toolName] = toolInstance;
                
                console.log(`Successfully loaded and instantiated ${toolName} tool`);
                
            } catch (error) {
                console.error(`Error loading tool ${toolName}:`, error);
                container.innerHTML = `<div style="color: red; text-align: center; padding: 20px;">Error loading ${toolName} tool: ${error.message}</div>`;
            }
        }
        
        // Selective unload tool - audio tools stay fully loaded, others get unloaded
        function selectiveUnloadTool(toolName) {
            // DISABLED: Tool unloading disabled to keep tools persistent for ticker functionality
            console.log(`Tool unloading disabled - ${toolName} remains loaded for ticker functionality`);
            return;
            
            /* COMMENTED OUT - Original unload logic
            if (window.loadedTools[toolName]) {
                const toolInstance = window.loadedTools[toolName];
                
                // Check if this is an audio tool - if so, don't unload anything
                if (isAudioTool(toolName)) {
                    console.log(`Audio tool ${toolName} - keeping fully loaded (no unloading)`);
                    // Do nothing - keep the tool completely loaded with UI and all
                    return;
                } else {
                    // Non-audio tools: full unload
                    console.log(`Non-audio tool ${toolName} - fully unloading`);
                    if (typeof toolInstance.destroy === 'function') {
                        toolInstance.destroy();
                    }
                    delete window.loadedTools[toolName];
                }
            }
            */
        }
        
        // Unload tool and cleanup (full unload)
        function unloadTool(toolName) {
            if (window.loadedTools[toolName]) {
                // Call destroy method if it exists
                if (typeof window.loadedTools[toolName].destroy === 'function') {
                    window.loadedTools[toolName].destroy();
                }
                
                // Remove reference
                delete window.loadedTools[toolName];
            }
        }
        
        // Helper: Check if tool is audio-based
        function isAudioTool(toolName) {
            return toolName === 'sounds' || toolName === 'ambient';
        }
        
        // Helper: Get global audio reference for tool
        function getGlobalAudioReference(toolName) {
            if (toolName === 'sounds') return 'childFocusNoise';
            if (toolName === 'ambient') return 'childAmbientNoise';
            return null;
        }

        // Ticker tape system for status rotation
        window.statusTicker = {
            currentIndex: 0,
            intervalId: null,
            isManualOverride: false,
            overrideTimeout: null,
            
            items: [
                {
                    id: 'ossc-status',
                    getText: () => {
                        if (window.oscilloscopeTool) {
                            return window.oscilloscopeTool.demoMode ? 'OssC - Demo Mode' : 'OssC - Ready';
                        }
                        return 'OssC - Initializing';
                    },
                    getType: () => {
                        if (window.oscilloscopeTool) {
                            return window.oscilloscopeTool.demoMode ? 'primary' : 'success';
                        }
                        return 'warning';
                    }
                },
                {
                    id: 'timer-status',
                    getText: () => {
                        const timerTool = window.loadedTools?.timer;
                        if (timerTool && timerTool.isRunning) {
                            const mins = Math.floor(timerTool.remainingSeconds / 60);
                            const secs = timerTool.remainingSeconds % 60;
                            return `Timer: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                        } else if (timerTool && timerTool.remainingSeconds < timerTool.totalSeconds) {
                            return 'Timer: Paused';
                        }
                        return 'Timer: Ready';
                    },
                    getType: () => {
                        const timerTool = window.loadedTools?.timer;
                        if (timerTool && timerTool.isRunning) return 'warning';
                        if (timerTool && timerTool.remainingSeconds < timerTool.totalSeconds) return 'accent';
                        return 'success';
                    }
                },
                {
                    id: 'todos-status',
                    getText: () => {
                        const todoTool = window.loadedTools?.todos;
                        if (todoTool) {
                            const allItems = Object.values(todoTool.lists).flatMap(list => list.items);
                            const pending = allItems.filter(item => !item.completed).length;
                            const completed = allItems.filter(item => item.completed).length;
                            if (pending === 0 && completed === 0) return 'Todos: Empty';
                            if (pending === 0) return `Todos: All done! (${completed})`;
                            return `Todos: ${pending} pending`;
                        }
                        return 'Todos: Not loaded';
                    },
                    getType: () => {
                        const todoTool = window.loadedTools?.todos;
                        if (todoTool) {
                            const allItems = Object.values(todoTool.lists).flatMap(list => list.items);
                            const pending = allItems.filter(item => !item.completed).length;
                            if (pending === 0) return 'success';
                            return 'primary';
                        }
                        return 'secondary';
                    }
                },
                {
                    id: 'ambient-status',  
                    getText: () => {
                        if (window.childAmbientNoise && window.childAmbientNoise.getActiveGenerators) {
                            const active = window.childAmbientNoise.getActiveGenerators();
                            if (active.length > 0) {
                                return `Ambient: ${active.join(', ')}`;
                            }
                        }
                        return 'Ambient: Silent';
                    },
                    getType: () => {
                        if (window.childAmbientNoise && window.childAmbientNoise.getActiveGenerators) {
                            const active = window.childAmbientNoise.getActiveGenerators();
                            return active.length > 0 ? 'accent' : 'success';
                        }
                        return 'success';
                    }
                },
                {
                    id: 'weather-status',  
                    getText: () => {
                        const weatherTool = window.loadedTools?.weather;
                        if (weatherTool && weatherTool.getTickerSummary) {
                            const summary = weatherTool.getTickerSummary();
                            if (summary) return summary;
                        }
                        return 'Weather: Not loaded';
                    },
                    getType: () => {
                        const weatherTool = window.loadedTools?.weather;
                        if (weatherTool && weatherTool.currentWeatherData) {
                            const temp = weatherTool.currentWeatherData.temperature;
                            if (temp !== undefined) {
                                if (temp < 0) return 'primary'; // Cold - blue
                                if (temp > 25) return 'danger'; // Hot - red
                                return 'success'; // Moderate - green
                            }
                        }
                        return 'secondary';
                    }
                }
            ],
            
            start() {
                this.update(); // Show first item immediately
                this.intervalId = setInterval(() => {
                    if (!this.isManualOverride) {
                        this.next();
                    }
                }, 3000); // Cycle every 3 seconds
            },
            
            stop() {
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
                if (this.overrideTimeout) {
                    clearTimeout(this.overrideTimeout);
                    this.overrideTimeout = null;
                }
            },
            
            next() {
                this.currentIndex = (this.currentIndex + 1) % this.items.length;
                this.update();
                this.pauseAutoForUserInteraction();
            },
            
            prev() {
                this.currentIndex = (this.currentIndex - 1 + this.items.length) % this.items.length;
                this.update();
                this.pauseAutoForUserInteraction();
            },
            
            // Pause auto-cycling when user manually navigates
            pauseAutoForUserInteraction() {
                this.isManualOverride = true;
                if (this.overrideTimeout) clearTimeout(this.overrideTimeout);
                this.overrideTimeout = setTimeout(() => {
                    this.isManualOverride = false;
                }, 10000); // Resume auto-cycling after 10 seconds of no interaction
            },
            
            update() {
                const item = this.items[this.currentIndex];
                const badge = document.getElementById('status-badge');
                if (badge) {
                    badge.textContent = item.getText();
                    badge.className = `badge badge-${item.getType()}`;
                }
            },
            
            // Allow temporary manual override 
            setManual(text, type, duration = 3000) {
                this.isManualOverride = true;
                const badge = document.getElementById('status-badge');
                if (badge) {
                    badge.textContent = text;
                    badge.className = `badge badge-${type}`;
                }
                
                if (this.overrideTimeout) clearTimeout(this.overrideTimeout);
                this.overrideTimeout = setTimeout(() => {
                    this.isManualOverride = false;
                    this.update(); // Resume normal rotation
                }, duration);
            },
            
            // Expand the tool section related to current ticker item
            expandCurrent() {
                const currentItem = this.items[this.currentIndex];
                this.pauseAutoForUserInteraction();
                
                // Map ticker items to their corresponding tool sections
                const sectionMap = {
                    'timer-status': 'timer',
                    'todos-status': 'todos', 
                    'ambient-status': 'sounds',
                    'weather-status': 'weather',
                    'ossc-status': null // OssC doesn't have a collapsible section
                };
                
                const sectionName = sectionMap[currentItem.id];
                if (sectionName) {
                    // Expand the corresponding section
                    const content = document.getElementById(sectionName + '-content');
                    const toggle = document.getElementById(sectionName + '-toggle');
                    
                    if (content && content.classList.contains('collapsed')) {
                        // Use the existing toggleSection function
                        if (window.toggleSection) {
                            window.toggleSection(sectionName);
                        }
                    }
                    
                    // Show feedback that the section was expanded
                    this.setManual(`Expanded ${sectionName} section`, 'primary', 2000);
                } else if (currentItem.id === 'ossc-status') {
                    // For OssC, toggle demo mode as an interaction
                    if (window.toggleDemo) {
                        window.toggleDemo();
                    }
                } else {
                    // Generic feedback for items without sections
                    this.setManual('No expandable section', 'secondary', 1500);
                }
            }
        };
        
        // Legacy function - now routes through ticker system
        window.updateStatus = function(text, type, duration) {
            if (duration === undefined) {
                // Permanent override (for backwards compatibility)
                window.statusTicker.setManual(text, type, 10000);
            } else {
                // Temporary override
                window.statusTicker.setManual(text, type, duration);
            }
        };
        
        // Usage Analytics & Gamification System - loaded as module
        
        window.timerUpdate = function(progress, isRunning) {
            if (window.oscilloscopeTool && isRunning) {
                window.oscilloscopeTool.breathingCircles.forEach((circle, index) => {
                    circle.breathingSpeed = 0.015 + (Math.random() * 0.01);
                    circle.opacity = 0.4 + (progress * 0.4);
                });
            }
        };

        window.timerComplete = function() {
            if (window.oscilloscopeTool) {
                const originalOpacity = window.oscilloscopeTool.breathingCircles.map(c => c.opacity);
                window.oscilloscopeTool.breathingCircles.forEach(circle => {
                    circle.opacity = 1.0;
                });

                setTimeout(() => {
                    window.oscilloscopeTool.breathingCircles.forEach((circle, index) => {
                        circle.opacity = originalOpacity[index];
                    });
                }, 500);
            }
        };
        
        // Global reference to ambient noise system (for OssC integration)
        window.childAmbientNoise = null;
        
        // Bind all event listeners (replaces inline onclick handlers blocked by CSP)
        function bindEventListeners() {
            // Settings button
            document.getElementById('settings-button').addEventListener('click', () => window.toggleSettings());

            // Settings menu items - use data-action attributes
            const actionMap = {
                'resizeHorizontal': () => window.resizeHorizontal(),
                'resizeVertical': () => window.resizeVertical(),
                'toggleDarkMode': () => window.toggleDarkMode(),
                'toggleDemo': () => window.toggleDemo(),
                'openSettingsWindow': () => window.openSettingsWindow()
            };
            document.querySelectorAll('.settings-item[data-action]').forEach(item => {
                item.addEventListener('click', () => {
                    const action = item.dataset.action;
                    if (actionMap[action]) actionMap[action]();
                });
            });

            // Ticker navigation
            document.getElementById('ticker-prev').addEventListener('click', () => window.statusTicker.prev());
            document.getElementById('status-badge').addEventListener('click', () => window.statusTicker.expandCurrent());
            document.getElementById('ticker-next').addEventListener('click', () => window.statusTicker.next());

            // Section headers - use data-section attributes
            document.querySelectorAll('.section-header[data-section]').forEach(header => {
                header.addEventListener('click', () => {
                    window.toggleSection(header.dataset.section);
                });
            });
        }

        // Close settings dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const settingsMenu = document.querySelector('.settings-menu');
            const dropdown = document.getElementById('settings-dropdown');
            
            if (!settingsMenu.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        // Store current background color globally for OssC integration
        window.currentBackgroundColor = null;
        
        // Randomize background on startup - Monochrome brighter aesthetic
        function randomizeBackground() {
            // Pick a single color for monochrome effect
            const baseColors = ['#4ecf9d', '#3f88c5', '#d72638', '#FF6B9F', '#FF9B54', '#B06BFF'];
            const selectedColor = baseColors[Math.floor(Math.random() * baseColors.length)];
            
            // Store for OssC to use
            window.currentBackgroundColor = selectedColor;
            
            const bg = document.getElementById('animated-bg');
            bg.innerHTML = '';
            
            // More shapes for denser effect
            const numCircles = 8 + Math.floor(Math.random() * 6);
            
            for (let i = 0; i < numCircles; i++) {
                const circle = document.createElement('div');
                circle.className = 'animated-circle';
                
                const size = 100 + Math.floor(Math.random() * 400);
                const top = -10 + Math.floor(Math.random() * 120);
                const left = -10 + Math.floor(Math.random() * 120);
                const delay = Math.random() * 12;
                const opacity = 0.2 + Math.random() * 0.3; // Increased opacity for brighter effect
                
                circle.style.cssText = `
                    width: ${size}px; 
                    height: ${size}px; 
                    background-color: ${selectedColor}; 
                    top: ${top}%; 
                    left: ${left}%; 
                    animation-delay: ${delay}s;
                    opacity: ${opacity};
                `;
                
                bg.appendChild(circle);
            }
            
            // Update OssC colors if it exists
            if (window.oscilloscope) {
                window.oscilloscope.updateComplementaryColors();
            }
        }
        
        // Initialize dark mode from saved preference
        function initializeDarkMode() {
            try {
                const savedTheme = localStorage.getItem('ucanduit-theme');
                if (savedTheme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.getElementById('dark-mode-setting-text').textContent = 'Light Mode';
                }
            } catch (error) {
                console.log('Could not load theme preference:', error);
            }
        }
        
        // Initialize settings integration with main application
        async function initializeSettingsIntegration() {
            try {
                // Import settings manager
                const { settings } = await import('./src/tools/settings.js');
                
                // Listen for settings changes
                settings.addListener('changed', ({ path, value }) => {
                    switch (path) {
                        case 'ui.theme':
                            applyTheme(value);
                            break;
                        case 'timer.defaultDuration':
                            updateTimerDefaults();
                            break;
                        case 'weather.locale':
                        case 'weather.units':
                            updateWeatherSettings();
                            break;
                        case 'audio.masterVolume':
                        case 'audio.ambientVolume':
                        case 'audio.musicVolume':
                            updateAudioSettings();
                            break;
                    }
                });
                
                // Apply current settings
                const currentTheme = settings.get('ui.theme');
                if (currentTheme) {
                    applyTheme(currentTheme);
                }
                
                // Make settings globally available for other modules
                window.ucanduitSettings = settings;
                
                console.log('Settings integration initialized');
            } catch (error) {
                console.error('Failed to initialize settings integration:', error);
            }
        }
        
        // Update timer defaults when settings change
        async function updateTimerDefaults() {
            if (window.loadedTools?.timer && typeof window.loadedTools.timer.loadSettings === 'function') {
                await window.loadedTools.timer.loadSettings();
                // Re-render timer if it exists
                if (typeof window.loadedTools.timer.render === 'function') {
                    window.loadedTools.timer.render();
                }
                console.log('Timer settings updated and applied');
            }
        }
        
        // Update weather settings when changed
        function updateWeatherSettings() {
            if (window.loadedTools?.weather) {
                // Weather tool will pick up new settings on next update
                console.log('Weather settings updated');
            }
        }
        
        // Update audio settings when changed
        function updateAudioSettings() {
            // Audio tools will pick up new volume settings
            console.log('Audio settings updated');
        }
        
        // Apply theme to main application
        function applyTheme(theme) {
            const html = document.documentElement;
            const darkModeText = document.getElementById('dark-mode-setting-text');
            
            if (theme === 'dark') {
                html.setAttribute('data-theme', 'dark');
                if (darkModeText) darkModeText.textContent = 'Light Mode';
                localStorage.setItem('ucanduit-theme', 'dark');
            } else if (theme === 'light') {
                html.setAttribute('data-theme', '');
                if (darkModeText) darkModeText.textContent = 'Dark Mode';
                localStorage.removeItem('ucanduit-theme');
            } else if (theme === 'auto') {
                // Auto mode - use system preference
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDark) {
                    html.setAttribute('data-theme', 'dark');
                    if (darkModeText) darkModeText.textContent = 'Light Mode';
                } else {
                    html.setAttribute('data-theme', '');
                    if (darkModeText) darkModeText.textContent = 'Dark Mode';
                }
                localStorage.removeItem('ucanduit-theme');
            }
        }
        
        // Load all modules on startup by expanding, loading, then collapsing
        async function loadAllModules() {
            const modules = ['timer', 'sounds', 'ambient', 'todos', 'memos', 'weather', 'lofi'];
            
            for (const moduleName of modules) {
                try {
                    // Get the actual UI container
                    const content = document.getElementById(moduleName + '-content');
                    const toggle = document.getElementById(moduleName + '-toggle');
                    
                    if (content && toggle) {
                        // Temporarily expand the section
                        content.classList.remove('collapsed');
                        toggle.classList.remove('collapsed');
                        
                        // Load the tool with the real container
                        await loadTool(moduleName, content);
                        
                        // Collapse it back
                        content.classList.add('collapsed');
                        toggle.classList.add('collapsed');
                        
                        console.log(`Successfully loaded ${moduleName} module`);
                    }
                } catch (error) {
                    console.error(`Failed to load ${moduleName} module:`, error);
                }
            }
            
            // Load oscilloscope tool
            try {
                const { OscilloscopeTool } = await import('./src/tools/oscilloscope.js');
                const canvas = document.getElementById('oscilloscope-canvas');
                window.oscilloscopeTool = new OscilloscopeTool(canvas);
                console.log('Successfully loaded oscilloscope module');
            } catch (error) {
                console.error('Failed to load oscilloscope module:', error);
            }
            
            console.log('All modules loaded successfully');
        }
        
        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', async () => {
            bindEventListeners();
            initializeDarkMode();
            randomizeBackground();
            // Initialize window using the imported module
            await window.windowManager.initializeWindow();
            
            // Initialize settings integration
            await initializeSettingsIntegration();
            
            // Initialize usage analytics
            const analytics = await import('./src/tools/analytics.js');
            window.usageAnalytics = new window.UsageAnalytics();
            window.usageAnalytics.init();
            
            // Load all modules on startup (no more selective loading)
            await loadAllModules();
            
            // Start ticker after a brief delay to let everything initialize
            setTimeout(() => {
                window.statusTicker.start();
            }, 1000);
        });
        
        // Handle window resize to update oscilloscope canvas
        window.addEventListener('resize', () => {
            if (window.oscilloscopeTool) {
                setTimeout(() => {
                    window.oscilloscopeTool.initializeCanvas();
                    window.oscilloscopeTool.initializeBoundaryContainer();
                }, 100);
            }
        });
        
        // Cleanup when page unloads
        window.addEventListener('beforeunload', () => {
            if (window.usageAnalytics) {
                window.usageAnalytics.shutdown();
            }
            if (window.oscilloscopeTool) {
                window.oscilloscopeTool.stop();
            }
        });
    </script>
    
</body>
</html>
